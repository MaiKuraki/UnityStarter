# CycloneGames.DataTable transactional Luban pipeline.
# UTF-8 without BOM. Unknown sections, unknown keys, and duplicates fail closed.

[luban]
luban_dll=../../Tools/DataTable/Luban/Luban.dll
windows_executable=../../Tools/DataTable/Luban/Luban.exe
executable_version=REPLACE_WITH_APPROVED_LUBAN_VERSION
executable_sha256=REPLACE_WITH_APPROVED_LUBAN_SHA256
windows_executable_sha256=REPLACE_WITH_APPROVED_LUBAN_EXE_SHA256
source_fingerprint=REPLACE_WITH_APPROVED_SOURCE_FINGERPRINT
process_timeout_seconds=600

[templates]
custom_template_dir=
bridge_files=

[codegen]
codegen_project=../../UnityStarter/Assets/ThirdParty/CycloneGames/CycloneGames.DataTable/Tools~/CodeGen/CycloneGames.DataTable.CodeGen.csproj
string_constant_tables=
string_constant_value_column=name
string_constant_comment_column=comment
string_constant_enabled_column=enabled
string_constant_scope_column=scope
string_constant_generated_comment_language=en

[profile.client]
code_output=../../UnityStarter/Assets/UnityStarter/Scripts/Generated/DataTable/
data_output=../../UnityStarter/Assets/StreamingAssets/DataTable/
code_target=cs-bin
data_target=bin
line_ending=crlf

[profile.server]
code_output=../../DataTable/Luban/Generated/Server/Code/
data_output=../../DataTable/Luban/Generated/Server/Data/
code_target=cs-bin
data_target=bin
line_ending=lf

[profile.all]
code_output=../../DataTable/Luban/Generated/All/Code/
data_output=../../DataTable/Luban/Generated/All/Data/
code_target=cs-bin
data_target=bin
line_ending=lf
